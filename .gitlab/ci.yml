# =========================================================
# 🧪 Validation & Continuous Integration
# =========================================================
#
# GitHub Equivalent
# -----------------
# .github/workflows/ci.yml
#
# Purpose
# -------
# Execute validation jobs for the documentation site.
#
# Responsibilities
# ----------------
# - Install Node.js dependencies
# - Validate TypeScript configuration
# - Verify Docusaurus builds successfully
# - Detect invalid MDX documents
# - Detect broken internal links
#
# Trigger Sources
# ---------------
# - Pushes
# - Merge Requests
# - Manual Pipelines
#
# Notes
# -----
# Docusaurus performs extensive validation during
# the build process.
#
# A successful build verifies:
# - Documentation structure
# - Sidebar configuration
# - Internal links
# - MDX syntax
# - Docusaurus configuration
#
# Future Enhancements
# -------------------
# - Markdown linting
# - Link validation
# - Spell checking
# - Documentation quality checks
#
# =========================================================

ci:validate:
  stage: test

  image: node:20

  before_script:
    # =====================================================
    # 🟢 NODE.JS ENVIRONMENT
    # =====================================================

    - node --version
    - corepack enable
    - yarn --version

    # =====================================================
    # 📦 INSTALL DEPENDENCIES
    # =====================================================

    - yarn install --immutable

  script:
    # =====================================================
    # 🎨 FORMATTING AND PORTAL TESTS
    # =====================================================

    - yarn format:check
    - yarn test

    # =====================================================
    # 🔍 TYPESCRIPT VALIDATION
    # =====================================================

    - yarn typecheck

    # =====================================================
    # 🏗️ DOCUSAURUS BUILD VALIDATION
    # =====================================================

    - yarn build

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

    - if: '$CI_COMMIT_BRANCH == "main"'

    - if: '$CI_COMMIT_BRANCH == "develop"'

    - if: '$CI_COMMIT_BRANCH == "dev"'
