# =========================================================
# 🚀 GitLab Pages Deployment
# =========================================================
#
# GitHub Equivalent
# -----------------
# .github/workflows/pages.yml
#
# Purpose
# -------
# Build and publish the Docusaurus documentation site
# using GitLab Pages.
#
# Responsibilities
# ----------------
# - Install Node.js dependencies
# - Build Docusaurus static site
# - Publish generated files
# - Host documentation through GitLab Pages
#
# Deployment Flow
# ---------------
#
# Source Code
# │
# ▼
# yarn install --immutable
# │
# ▼
# yarn build
# │
# ▼
# build/
# │
# ▼
# GitLab Pages
#
#
# Output
# ------
# Docusaurus generates build/. The pages.publish setting exposes that directory
# directly, so no intermediate public/ copy is required.
#
#
# Trigger
# -------
# - Push to main branch
# - Manual pipeline execution
#
#
# Notes
# -----
# - Docker and Compose are optional local and CI validation tools
# - Pages deployment does not consume the production-preview image
# - No container registry required
# - Release-page automation is handled separately by release.yml
#
# Docusaurus produces a fully static website.
#
#
# Future Enhancements
# -------------------
# - Custom domain support
# - Cloudflare integration
# - Lighthouse auditing
# - Broken-link validation
# - Documentation versioning
#
# =========================================================

deploy-pages:
  stage: deploy

  image: node:20

  before_script:
    # =====================================================
    # 🟢 NODE.JS ENVIRONMENT
    # =====================================================

    - node --version
    - corepack enable
    - yarn --version

    # =====================================================
    # 📦 INSTALL DEPENDENCIES
    # =====================================================

    - yarn install --immutable

  script:
    # =====================================================
    # 🏗️ BUILD DOCUMENTATION
    # =====================================================

    - yarn build

  pages:
    publish: build

  environment:
    name: production
    url: $CI_PAGES_URL

  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
